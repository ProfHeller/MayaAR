<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MayaAR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#e9e7e1;--fg:#1f2523;--muted:#5d6360;--rule:#c3bfb4;--accent:#1f6f86}
@media (prefers-color-scheme:dark){:root{--bg:#171a19;--fg:#e6e3da;--muted:#9da29e;--rule:#343937;--accent:#6fc0d4;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 "Source Serif 4",Georgia,serif}
main{max-width:720px;margin:0 auto;padding:48px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px))}
h1{font:400 48px/1.05 "Marcellus",Georgia,serif;margin:0 0 8px}
.eyebrow{font:500 12px/1.2 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
ul{list-style:none;padding:0;margin:32px 0 0;border-top:1px solid var(--rule)}
li{border-bottom:1px solid var(--rule)}
a{display:flex;justify-content:space-between;gap:16px;padding:16px 0;color:var(--fg);text-decoration:none}
a:hover .name,a:focus-visible .name{color:var(--accent)}
.name{font:400 24px/1.2 "Marcellus",Georgia,serif}
.meta{font:400 13px/1.8 "IBM Plex Mono",monospace;color:var(--muted);text-align:right}
</style>
</head>
<body>
<main>
<p class="eyebrow">3D and AR</p>
<h1>MayaAR</h1>
<p>Maya monuments to view in 3D in the browser and in augmented reality on phones and tablets.</p>
<ul>
<li><a href="stela31/"><span class="name">Tikal Stela 31</span><span class="meta">Tikal · 445 CE</span></a></li>
</ul>
</main>
</body>
</html>
